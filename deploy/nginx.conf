# ZCZR demo — Nginx static site (Plan B)
# Copy to /etc/nginx/sites-available/zczr and symlink into sites-enabled.
# Replace zczr.example.com and the certificate paths before enabling HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name zczr.example.com www.zczr.example.com;

    root /var/www/zczr/current;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Astro directory-style URLs: /products/ridge-40/ -> /products/ridge-40/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Fingerprinted Astro assets can be cached aggressively.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images, fonts, and other static files.
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|webp|avif|svg|jpg|jpeg|png|gif|ico|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Always revalidate the HTML shell so new releases go live immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # After `certbot --nginx -d zczr.example.com -d www.zczr.example.com`,
    # Certbot will add the HTTPS server block and redirect. Keep this block for port 80.
}

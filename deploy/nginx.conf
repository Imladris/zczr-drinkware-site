# ZCZR production — Nginx static site + contact API reverse proxy.
# Copy to /etc/nginx/sites-available/zczr and symlink into sites-enabled.
# Replace the certificate paths after running certbot for zczr.com.cn.

limit_req_zone $binary_remote_addr zone=contact_api:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name zczr.com.cn www.zczr.com.cn;

    root /var/www/zczr/current;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    # Astro directory-style URLs: /products/.../ -> /products/.../index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Contact form API (Node service managed by systemd).
    location /api/ {
        limit_req zone=contact_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        proxy_connect_timeout 5s;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Fingerprinted Astro assets can be cached aggressively.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images, fonts, and other static files.
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|webp|avif|svg|jpg|jpeg|png|gif|ico|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Always revalidate the HTML shell so new releases go live immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # After `certbot --nginx -d zczr.com.cn -d www.zczr.com.cn`,
    # Certbot adds the HTTPS server block and redirect.
}
